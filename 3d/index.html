<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Pokédex 3D - Edição Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080f;
      --bg2: #0e1020;
      --card: #141628;
      --border: #1e1e38;
      --text: #e8eeff;
      --muted: #6668aa;
      --accent: #4cc9f0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* Fundo Estrelado */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,.5) 0%, transparent 100%),
                  radial-gradient(1px 1px at 90% 85%, rgba(255,255,255,.3) 0%, transparent 100%);
    }

    header {
      padding: 20px; text-align: center; position: relative; z-index: 10;
      background: linear-gradient(to bottom, var(--bg), transparent);
    }
    header h1 { font-family: 'Press Start 2P', cursive; font-size: 1.2rem; color: var(--accent); text-shadow: 0 0 10px rgba(76,201,240,0.5); }

    main { display: flex; flex-direction: row; gap: 20px; padding: 0 20px 20px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; height: calc(100vh - 100px); }

    /* LISTA LATERAL */
    .sidebar { width: 320px; background: var(--bg2); border: 1px solid var(--border); border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; }
    .search-box { padding: 15px; border-bottom: 1px solid var(--border); }
    .search-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: #fff; font-family: inherit; }

    .mon-list { flex: 1; overflow-y: auto; padding: 10px; }
    .mon-item {
      display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 10px; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; margin-bottom: 5px;
    }
    .mon-item:hover { background: var(--card); border-color: var(--border); }
    .mon-item.active { background: var(--accent); color: var(--bg); font-weight: bold; }
    .mon-item img { width: 50px; height: 50px; object-fit: contain; }

    /* VIEWPORT 3D */
    .view-container { flex: 1; position: relative; background: radial-gradient(circle at center, #1a1c3a 0%, var(--bg) 100%); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
    #renderCanvas { width: 100%; height: 100%; outline: none; touch-action: none; }

    /* INFO DO POKEMON */
    .overlay-info { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    .mon-id { font-family: 'Press Start 2P'; font-size: 0.8rem; color: var(--accent); }
    .mon-name { font-size: 2.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }

    .stats-panel { position: absolute; bottom: 20px; right: 20px; background: rgba(20, 22, 40, 0.8); backdrop-filter: blur(10px); padding: 15px; border-radius: 15px; border: 1px solid var(--border); width: 220px; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
    .stat-label { color: var(--muted); text-transform: uppercase; font-weight: bold; }

    /* STATUS DE CARREGAMENTO */
    .status-badge {
      position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.5); 
      padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1);
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>

<body>

  <header>
    <h1>POKÉDEX 3D SYSTEM</h1>
  </header>

  <main>
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Pesquisar Pokémon..." oninput="filterList()">
      </div>
      <div class="mon-list" id="mon-list">
        </div>
    </div>

    <div class="view-container">
      <canvas id="renderCanvas"></canvas>
      
      <div class="overlay-info">
        <div class="mon-id" id="mon-id">#000</div>
        <div class="mon-name" id="mon-name">SELECIONE</div>
        <div id="mon-type" style="color: var(--muted); font-weight: bold;">---</div>
      </div>

      <div class="stats-panel">
        <div class="stat-row"><span class="stat-label">Peso</span><span id="mon-weight">0 kg</span></div>
        <div class="stat-row"><span class="stat-label">Altura</span><span id="mon-height">0 m</span></div>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">
        <div style="font-size: 0.7rem; color: var(--muted); text-align: center;">CONTROLES: Mouse para girar / Scroll para Zoom</div>
      </div>

      <div class="status-badge" id="glb-status">Aguardando seleção...</div>
    </div>
  </main>

  <script>
    let canvas, engine, scene, camera, root;
    let currentMon = null;
    let allPokemon = [];

    // ══════════════════════════════════════════
    // 1. CARREGAR MODELO 3D (Onde a mágica acontece)
    // ══════════════════════════════════════════
    async function loadGLB(url) {
      const status = document.getElementById('glb-status');
      status.textContent = 'Carregando arquivo 3D...';
      status.style.color = '#accent';
      
      try {
        // Limpa modelos anteriores
        if (root) {
            root.dispose();
            root = null;
        }

        // Separa caminho da pasta e nome do arquivo
        const li = url.lastIndexOf('/');
        const rootUrl = li >= 0 ? url.slice(0, li + 1) : '';
        const fname = li >= 0 ? url.slice(li + 1) : url;

        // Importa o arquivo da sua pasta local "modelos/"
        const result = await BABYLON.SceneLoader.ImportMeshAsync('', rootUrl, fname, scene);
        root = result.meshes[0];

        // AJUSTES VISUAIS (Essencial para .GLB)
        root.normalizeToUnitCube(); // Redimensiona para tamanho padrão
        root.scaling.scaleInPlace(8); // Aumenta para um tamanho bom na tela
        root.position = new BABYLON.Vector3(0, 0, 0); // Centraliza
        root.position.y = -2; // Ajusta altura no chão virtual

        // ILUMINAÇÃO AMBIENTE (Resolve o problema do modelo ficar preto)
        if (!scene.environmentTexture) {
          scene.createDefaultEnvironment({
            createSkybox: false,
            createGround: false,
            environmentTexture: "https://playground.babylonjs.com/textures/environment.dds"
          });
        }

        // Foca a câmera no novo Pokémon
        camera.setTarget(BABYLON.Vector3.Zero());

        status.style.color = '#60cc80';
        status.textContent = '✅ Modelo 3D ativo';
        
      } catch (e) {
        status.style.color = '#ff5555';
        status.textContent = '❌ Sem arquivo .glb para este ID';
        console.warn("Dica: Adicione 'modelos/" + url.split('/').pop() + "' na sua pasta.");
      }
    }

    // ══════════════════════════════════════════
    // 2. SELECIONAR POKÉMON (Lógica da PokeAPI)
    // ══════════════════════════════════════════
    async function selectMon(id) {
      if (id === currentMon) return;
      currentMon = id;

      // Marcar na lista lateral
      document.querySelectorAll('.mon-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.querySelector(`.mon-item[data-id="${id}"]`);
      if(activeItem) activeItem.classList.add('active');

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
        const data = await res.json();

        // Atualiza textos
        document.getElementById('mon-name').textContent = data.name;
        document.getElementById('mon-id').textContent = '#' + String(data.id).padStart(3, '0');
        document.getElementById('mon-type').textContent = data.types.map(t => t.type.name.toUpperCase()).join(' | ');
        document.getElementById('mon-weight').textContent = (data.weight / 10) + ' KG';
        document.getElementById('mon-height').textContent = (data.height / 10) + ' M';

        // 👇 CHAMA O SEU ARQUIVO LOCAL 👇
        // Se você clicou no Charmander (ID 4), ele busca "modelos/4.glb"
        loadGLB(`modelos/${data.id}.glb`);

      } catch (e) {
        console.error("Erro PokeAPI:", e);
      }
    }

    // ══════════════════════════════════════════
    // 3. INICIALIZAÇÃO DO MOTOR 3D
    // ══════════════════════════════════════════
    function init3D() {
      canvas = document.getElementById('renderCanvas');
      engine = new BABYLON.Engine(canvas, true);
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0, 0, 0, 0); // Fundo transparente

      // Câmera
      camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/2.2, 15, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 5;
      camera.upperRadiusLimit = 30;
      camera.useAutoRotationBehavior = true; // Fica girando sozinho

      // Luzes
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
      light.intensity = 1.5;

      const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
      dirLight.intensity = 1;

      engine.runRenderLoop(() => scene.render());
      window.addEventListener('resize', () => engine.resize());
    }

    // ══════════════════════════════════════════
    // 4. FUNÇÕES DE LISTAGEM (AUXILIARES)
    // ══════════════════════════════════════════
    async function fetchList() {
      const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=151');
      const data = await res.json();
      allPokemon = data.results.map((p, i) => ({ ...p, id: i + 1 }));
      renderList(allPokemon);
    }

    function renderList(list) {
      const container = document.getElementById('mon-list');
      container.innerHTML = '';
      list.forEach(p => {
        const item = document.createElement('div');
        item.className = 'mon-item';
        item.setAttribute('data-id', p.id);
        item.innerHTML = `
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png">
          <span>${p.name.toUpperCase()}</span>
        `;
        item.onclick = () => selectMon(p.id);
        container.appendChild(item);
      });
    }

    function filterList() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allPokemon.filter(p => p.name.includes(q) || p.id.toString() === q);
      renderList(filtered);
    }

    // START
    window.onload = () => {
      init3D();
      fetchList();
    };
  </script>
</body>
</html>
