<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Pokédex 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&family=Nunito:wght@400;700;900&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07080f;
      --bg2: #0e1020;
      --card: #141628;
      --border: #1e1e38;
      --text: #e8eeff;
      --muted: #6668aa;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* STARS */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(1px 1px at 8% 12%, rgba(255, 255, 255, .55) 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 67%, rgba(255, 255, 255, .4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 8%, rgba(255, 255, 255, .6) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 35%, rgba(255, 255, 255, .45) 0%, transparent 100%),
        radial-gradient(1px 1px at 91% 72%, rgba(255, 255, 255, .35) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 88%, rgba(255, 255, 255, .3) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 45%, rgba(255, 255, 255, .4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 55%, rgba(255, 255, 255, .5) 0%, transparent 100%),
        radial-gradient(1px 1px at 33% 28%, rgba(255, 255, 255, .35) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 90%, rgba(255, 255, 255, .45) 0%, transparent 100%);
    }

    /* ── VIEWS ── */
    .view {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow-y: auto;
      transition: opacity .35s, transform .35s;
    }

    .view.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
    }

    /* ═══════════════════════════════════
   HOME VIEW
═══════════════════════════════════ */
    #home {
      background: transparent;
    }

    .home-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(7, 8, 15, .92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .home-logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      background: linear-gradient(90deg, #ff4444 50%, #fff 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .home-logo span {
      background: linear-gradient(90deg, #fff 0%, #aaddff 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      max-width: 420px;
      position: relative;
    }

    .search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: border-color .2s;
    }

    #search-input:focus {
      border-color: rgba(255, 255, 255, .3);
    }

    #search-input::placeholder {
      color: var(--muted);
    }

    .home-count {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    /* GRID */
    .poke-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .poke-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      padding: 20px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeUp .4s ease both;
    }

    .poke-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, .2);
    }

    .poke-card:hover .card-ball {
      transform: scale(1.1) rotate(10deg);
    }

    .card-num {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, .2);
      letter-spacing: 1px;
    }

    .card-ball {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto;
      transition: transform .3s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .card-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: var(--text);
      text-align: center;
      line-height: 1.6;
    }

    .card-types {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .type-chip {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: .5px;
    }

    .card-stats-mini {
      display: flex;
      gap: 4px;
      justify-content: center;
    }

    .mini-bar {
      height: 3px;
      border-radius: 999px;
      flex: 1;
    }

    .card-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 16px;
      opacity: .12;
      transition: opacity .2s;
    }

    .poke-card:hover .card-glow {
      opacity: .22;
    }

    /* ═══════════════════════════════════
   DETAIL VIEW
═══════════════════════════════════ */
    #detail {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      overflow: hidden;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(7, 8, 15, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      height: 52px;
      z-index: 5;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      transition: all .18s;
    }

    .back-btn:hover {
      border-color: rgba(255, 255, 255, .25);
      color: var(--text);
    }

    .detail-title-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .detail-poke-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #fff;
      transition: color .3s;
    }

    .detail-poke-num {
      font-size: 12px;
      color: var(--muted);
    }

    .detail-types {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .detail-body {
      display: grid;
      grid-template-columns: 1fr 340px;
      overflow: hidden;
    }

    @media(max-width:800px) {
      .detail-body {
        grid-template-columns: 1fr;
      }

      .side-panel {
        display: none;
      }
    }

    /* Canvas */
    .canvas-wrap {
      position: relative;
      overflow: hidden;
    }

    #rc {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    .canvas-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .5);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 11px;
      color: rgba(255, 255, 255, .35);
      white-space: nowrap;
      pointer-events: none;
    }

    /* quality badge */
    .quality-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 9px;
      font-family: 'Press Start 2P', monospace;
      color: rgba(255, 255, 255, .35);
      pointer-events: none;
      letter-spacing: .5px;
    }

    /* Side panel */
    .side-panel {
      border-left: 1px solid var(--border);
      background: rgba(8, 8, 15, .65);
      backdrop-filter: blur(10px);
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .side-panel::-webkit-scrollbar {
      width: 3px;
    }

    .side-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .sec-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--muted);
      margin-bottom: 11px;
      letter-spacing: 1px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      width: 90px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
      font-weight: 700;
    }

    .stat-sl {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      outline: none;
      cursor: pointer;
    }

    .stat-sl::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--acc, #fff);
      cursor: pointer;
      border: 2px solid rgba(0, 0, 0, .4);
      transition: transform .15s;
    }

    .stat-sl::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .stat-num {
      width: 42px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--acc, #fff);
      text-align: center;
      font-family: 'Rajdhani', sans-serif;
      -moz-appearance: textfield;
      transition: border-color .2s;
    }

    .stat-num::-webkit-outer-spin-button,
    .stat-num::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    .stat-num:focus {
      outline: none;
      border-color: var(--acc, #fff);
    }

    .desc-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.75;
    }

    .desc-text strong {
      color: var(--text);
    }

    .identify-btn {
      width: 100%;
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all .18s;
    }

    .identify-btn:hover {
      background: rgba(255, 255, 255, .09);
    }

    .identify-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .ai-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px;
      font-size: 13px;
      line-height: 1.7;
      color: var(--muted);
    }

    .ai-box strong {
      color: var(--text);
    }

    .ai-box.loading {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .spin {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .ctrls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .ctrl {
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 6px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      font-family: 'Rajdhani', sans-serif;
    }

    .ctrl:hover {
      background: rgba(255, 255, 255, .09);
      color: var(--text);
    }

    /* GLB Loader */
    .glb-input {
      width: 100%;
      padding: 8px 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 8px;
    }

    .glb-input:focus {
      border-color: rgba(255, 255, 255, .25);
    }

    .glb-input::placeholder {
      color: var(--muted);
    }

    .glb-status {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      min-height: 16px;
      margin-top: 6px;
      line-height: 1.5;
    }

    .glb-hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 10px;
    }

    .glb-hint a {
      color: #60a8ff;
      text-decoration: none;
    }

    .glb-hint a:hover {
      text-decoration: underline;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* TYPE COLORS */
    .t-eletrico {
      background: rgba(245, 200, 0, .15);
      color: #F5C800;
      border: 1px solid rgba(245, 200, 0, .3);
    }

    .t-fogo {
      background: rgba(224, 90, 0, .15);
      color: #ff8040;
      border: 1px solid rgba(224, 90, 0, .3);
    }

    .t-voador {
      background: rgba(111, 168, 255, .12);
      color: #90c0ff;
      border: 1px solid rgba(111, 168, 255, .25);
    }

    .t-psiquico {
      background: rgba(224, 64, 160, .15);
      color: #f080d0;
      border: 1px solid rgba(224, 64, 160, .3);
    }

    .t-fantasma {
      background: rgba(96, 64, 192, .2);
      color: #a080ff;
      border: 1px solid rgba(96, 64, 192, .35);
    }

    .t-veneno {
      background: rgba(144, 64, 160, .15);
      color: #d080e0;
      border: 1px solid rgba(144, 64, 160, .3);
    }

    .t-lutador {
      background: rgba(192, 48, 32, .15);
      color: #ff8070;
      border: 1px solid rgba(192, 48, 32, .3);
    }

    .t-aco {
      background: rgba(128, 144, 160, .15);
      color: #b0c0d0;
      border: 1px solid rgba(128, 144, 160, .25);
    }

    .t-normal {
      background: rgba(160, 160, 96, .12);
      color: #c8c880;
      border: 1px solid rgba(160, 160, 96, .22);
    }

    .t-dragao {
      background: rgba(64, 96, 208, .18);
      color: #80a8ff;
      border: 1px solid rgba(64, 96, 208, .35);
    }

    .t-agua {
      background: rgba(32, 128, 192, .15);
      color: #60b8f0;
      border: 1px solid rgba(32, 128, 192, .3);
    }

    .t-terra {
      background: rgba(192, 160, 64, .12);
      color: #e0c860;
      border: 1px solid rgba(192, 160, 64, .25);
    }
  </style>
</head>

<body>

  <!-- ═══ HOME ═══ -->
  <div id="home" class="view">
    <div class="home-header">
      <div class="home-logo">Poké<span>Dex 3D</span></div>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Pesquisar Pokémon..." oninput="filterGrid(this.value)" />
      </div>
      <div class="home-count" id="grid-count">10 Pokémon</div>
    </div>
    <div class="poke-grid" id="poke-grid"></div>
  </div>

  <!-- ═══ DETAIL ═══ -->
  <div id="detail" class="view hidden">
    <div class="detail-header">
      <button class="back-btn" onclick="goHome()">← Voltar</button>
      <div class="detail-title-bar">
        <div class="detail-poke-name" id="d-name">—</div>
        <div class="detail-poke-num" id="d-num">—</div>
        <div class="detail-types" id="d-types"></div>
      </div>
    </div>
    <div class="detail-body">
      <div class="canvas-wrap">
        <canvas id="rc"></canvas>
        <div class="canvas-hint">🖱 Arraste para orbitar · Scroll para zoom</div>
        <div class="quality-badge">✦ PBR · BLOOM · FXAA</div>
      </div>
      <aside class="side-panel" id="side-panel"></aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.44.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.44.0/babylonjs.loaders.min.js"></script>

    // ══════════════════════════════════════════
    // GLB LOADER
    // ══════════════════════════════════════════
    async function loadGLB(id) {
      const inp = document.getElementById('glb-url');
      const url = inp?.value?.trim();
      if (!url || !scene) { return; }
      const status = document.getElementById('glb-status');
      status.style.color = 'var(--muted)';
      status.textContent = '⏳ Carregando modelo...';

      try {
        // Hide original root meshes
        if (root) root.getChildMeshes(false).forEach(m => { m.isVisible = false; });

        // Split URL into rootUrl + filename for SceneLoader
        const li = url.lastIndexOf('/');
        const rootUrl = li >= 0 ? url.slice(0, li + 1) : '';
        const fname = li >= 0 ? url.slice(li + 1) : url;

        const result = await BABYLON.SceneLoader.ImportMeshAsync('', rootUrl, fname, scene);

        // --- ADICIONE ESTAS LINHAS ABAIXO ---

        // Pega o nó principal do modelo que acabou de carregar
        const rootMesh = result.meshes[0];

        // 1. Magia do Babylon: redimensiona e centraliza o objeto automaticamente!
        rootMesh.normalizeToUnitCube();

        // 2. Coloca ele exatamente no centro do seu cenário (caso não tenha ido)
        rootMesh.position = new BABYLON.Vector3(0, 0, 0);

        // 3. Força a sua câmera a focar no modelo
        if (camera) {
          camera.setTarget(rootMesh);
        }



        // Auto-fit the loaded model
        const world = result.meshes.filter(m => m.getTotalVertices() > 0);
        if (world.length > 0) {
          world.forEach(m => m.computeWorldMatrix(true));
          let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
          world.forEach(m => {
            const bi = m.getBoundingInfo().boundingBox;
            minX = Math.min(minX, bi.minimumWorld.x); minY = Math.min(minY, bi.minimumWorld.y); minZ = Math.min(minZ, bi.minimumWorld.z);
            maxX = Math.max(maxX, bi.maximumWorld.x); maxY = Math.max(maxY, bi.maximumWorld.y); maxZ = Math.max(maxZ, bi.maximumWorld.z);
          });
          const h = maxY - minY || 1, w = maxX - minX || 1, d = maxZ - minZ || 1;
          const maxDim = Math.max(h, w, d);
          const targetSize = 9;
          const sc2 = targetSize / maxDim;
          const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
          const wrapper = new BABYLON.TransformNode('glb_wrap', scene);
          wrapper.scaling.setAll(sc2);
          wrapper.position.set(-cx * sc2, -cy * sc2, -cz * sc2);
          // Parent root-level meshes to wrapper
          result.meshes.forEach(m => { if (!m.parent || !result.meshes.includes(m.parent)) { m.parent = wrapper; } });
        }

        status.style.color = '#60cc80';
        status.textContent = '✅ Modelo carregado com sucesso!';
      } catch (e) {
        if (root) root.getChildMeshes(false).forEach(m => { m.isVisible = true; });
        status.style.color = '#e84020';
        status.textContent = '❌ Falha ao carregar. Verifique a URL e as permissões CORS do servidor.';
        console.error('GLB load error:', e);
      }
    }

      if (fromNum) { const sl = document.querySelectorAll('.stat-sl')[i]; if (sl) sl.value = v; }
      else { const nm = document.getElementById('sn_' + i); if (nm) nm.value = v; }
      const ab = document.getElementById('ai-box'); if (ab) ab.style.display = 'none';
    }

    async function identify(id) {
      const p = PK[id]; const vals = statVals[id];
      const btn = document.getElementById('ai-btn'); const box = document.getElementById('ai-box');
      btn.disabled = true; box.style.display = 'flex'; box.className = 'ai-box loading';
      box.innerHTML = '<div class="spin"></div><span>Analisando...</span>';
      const statsText = STAT_LABELS.map((lb, i) => `${lb}: ${vals[i]}`).join(', ');
      const prompt = `Você é especialista em Pokémon. Analise estes status base e identifique qual Pokémon mais se aproxima. Se os valores foram alterados, explique qual seria o mais próximo e por quê. Responda em português em até 4 linhas.\n\nStatus: ${statsText}`;
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] }) });
        const data = await res.json();
        const txt = data.content?.[0]?.text || 'Não foi possível identificar.';
        box.className = 'ai-box'; box.style.display = 'block';
        const [first, ...rest] = txt.split('. '); box.innerHTML = `<strong>${first}.</strong> ${rest.join('. ')}`;
      } catch (e) { box.className = 'ai-box'; box.style.display = 'block'; box.innerHTML = '<strong>Erro de conexão.</strong> Verifique e tente novamente.'; }
      btn.disabled = false;
    }
